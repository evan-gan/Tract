<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <title>Tract — bottom tool dock mockup</title>

  <defs>
    <!-- Icons are drawn centred on (0,0) at roughly a 19pt SF Symbol size and
         inherit their colour from the `color` attribute on each <use>. -->
    <g id="icon-pen" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M -4.5,-9 L 4.5,-9 L 4.5,1.5 L 0,9.5 L -4.5,1.5 Z"/>
      <path d="M -4.5,1.5 L 4.5,1.5"/>
      <path d="M 0,3.5 L 0,9.5" stroke-width="2.6"/>
    </g>

    <g id="icon-eraser" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <g transform="rotate(-32)">
        <rect x="-9.5" y="-5.5" width="19" height="11" rx="2.5"/>
        <path d="M 0.5,-5.5 L 0.5,5.5"/>
      </g>
    </g>

    <g id="icon-lasso" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <ellipse cx="0.5" cy="-2.5" rx="8.5" ry="5.5"/>
      <path d="M -4,2 C -5.5,6 -1.5,7.5 1,6.5"/>
      <circle cx="2" cy="7.5" r="1.6" fill="currentColor" stroke="none"/>
    </g>

    <g id="icon-undo" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M 7,8 C 7,-2 2,-6 -4.5,-6"/>
      <path d="M -1,-10 L -5.5,-6 L -1,-2"/>
    </g>

    <g id="icon-weight" fill="currentColor">
      <rect x="-10" y="-8" width="20" height="1" rx="0.5"/>
      <rect x="-10" y="-2.75" width="20" height="2.5" rx="1.25"/>
      <rect x="-10" y="3.5" width="20" height="4.5" rx="2.25"/>
    </g>

    <!-- Twelve wedges standing in for the colour wheel's angular gradient. -->
    <g id="ink-wheel">
      <path d="M0,0 L13,0 A13,13 0 0,1 11.26,6.5 Z" fill="hsl(0,85%,55%)"/>
      <path d="M0,0 L11.26,6.5 A13,13 0 0,1 6.5,11.26 Z" fill="hsl(30,85%,55%)"/>
      <path d="M0,0 L6.5,11.26 A13,13 0 0,1 0,13 Z" fill="hsl(60,85%,55%)"/>
      <path d="M0,0 L0,13 A13,13 0 0,1 -6.5,11.26 Z" fill="hsl(90,85%,50%)"/>
      <path d="M0,0 L-6.5,11.26 A13,13 0 0,1 -11.26,6.5 Z" fill="hsl(120,80%,45%)"/>
      <path d="M0,0 L-11.26,6.5 A13,13 0 0,1 -13,0 Z" fill="hsl(150,80%,45%)"/>
      <path d="M0,0 L-13,0 A13,13 0 0,1 -11.26,-6.5 Z" fill="hsl(180,80%,48%)"/>
      <path d="M0,0 L-11.26,-6.5 A13,13 0 0,1 -6.5,-11.26 Z" fill="hsl(210,85%,55%)"/>
      <path d="M0,0 L-6.5,-11.26 A13,13 0 0,1 0,-13 Z" fill="hsl(240,80%,58%)"/>
      <path d="M0,0 L0,-13 A13,13 0 0,1 6.5,-11.26 Z" fill="hsl(270,75%,58%)"/>
      <path d="M0,0 L6.5,-11.26 A13,13 0 0,1 11.26,-6.5 Z" fill="hsl(300,75%,55%)"/>
      <path d="M0,0 L11.26,-6.5 A13,13 0 0,1 13,0 Z" fill="hsl(330,80%,55%)"/>
    </g>

    <!-- Sheen down the pill: the glass is brightest along its top edge. -->
    <linearGradient id="glass-sheen-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f2f2f4" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="glass-sheen-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2e" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#141416" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="dock-shadow" x="-20%" y="-60%" width="140%" height="260%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ececf0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ================= Light appearance ================= -->
  <g>
    <rect x="0" y="0" width="700" height="220" fill="#ffffff"/>
    <rect x="0" y="0" width="700" height="220" fill="url(#paper-grid)"/>
    <text x="20" y="30" font-size="12" fill="#8a8a90" letter-spacing="0.6">LIGHT</text>

    <g transform="translate(54.5,140)" filter="url(#dock-shadow)">
      <rect x="0" y="0" width="591" height="50" rx="26" fill="url(#glass-sheen-light)"/>
      <rect x="0.5" y="0.5" width="590" height="49" rx="25.5" fill="none" stroke="#000000" stroke-opacity="0.10"/>

      <!-- grab handle -->
      <rect x="15.5" y="14" width="5" height="22" rx="2.5" fill="#000000" fill-opacity="0.30"/>

      <!-- undo / redo -->
      <g color="#00000090">
        <use href="#icon-undo" x="50" y="25"/>
        <g transform="translate(90,25) scale(-1,1)"><use href="#icon-undo"/></g>
      </g>

      <line x1="114.5" y1="13" x2="114.5" y2="37" stroke="#000000" stroke-opacity="0.14"/>

      <!-- tools: pen is active, so it tints and lifts toward the canvas -->
      <g transform="translate(0,-5)">
        <rect x="119" y="5" width="40" height="40" rx="12" fill="#ff3b30" fill-opacity="0.22"/>
        <use href="#icon-pen" x="139" y="25" color="#ff3b30"/>
      </g>
      <use href="#icon-eraser" x="181" y="25" color="#00000090"/>
      <use href="#icon-lasso" x="223" y="25" color="#00000090"/>

      <line x1="247.5" y1="13" x2="247.5" y2="37" stroke="#000000" stroke-opacity="0.14"/>
      <g transform="translate(272,25)" fill="#00000090"><rect x="-10" y="-8" width="20" height="1" rx="0.5"/><rect x="-10" y="-2.75" width="20" height="2.5" rx="1.25"/><rect x="-10" y="3.5" width="20" height="4.5" rx="2.25"/></g>
      <line x1="296.5" y1="13" x2="296.5" y2="37" stroke="#000000" stroke-opacity="0.14"/>

      <!-- quick ink palette; the active colour is ringed in its own colour -->
      <g stroke="#000000" stroke-opacity="0.15" stroke-width="0.5">
        <circle cx="321" cy="25" r="12" fill="#ffffff"/>
        <circle cx="361" cy="25" r="12" fill="#0d0d0d"/>
        <circle cx="401" cy="25" r="12" fill="#0d73f2"/>
        <circle cx="441" cy="25" r="12" fill="#1ab340"/>
        <circle cx="481" cy="25" r="12" fill="#f2bf1a"/>
        <circle cx="521" cy="25" r="12" fill="#d92626"/>
        <circle cx="361" cy="25" r="18" fill="none"/>
      </g>
      <circle cx="361" cy="25" r="17" fill="none" stroke="#0d0d0d" stroke-width="2"/>

      <!-- colour wheel: everything outside the quick palette -->
      <g transform="translate(561,25)">
        <use href="#ink-wheel"/>
        <circle r="13" fill="none" stroke="#000000" stroke-opacity="0.15" stroke-width="0.5"/>
      </g>
    </g>
  </g>

  <!-- ================= Dark appearance ================= -->
  <g transform="translate(0,220)">
    <!-- The paper stays white in both schemes; only the chrome changes. -->
    <rect x="0" y="0" width="700" height="220" fill="#ffffff"/>
    <rect x="0" y="0" width="700" height="220" fill="url(#paper-grid)"/>
    <text x="20" y="30" font-size="12" fill="#8a8a90" letter-spacing="0.6">DARK</text>

    <g transform="translate(54.5,140)" filter="url(#dock-shadow)">
      <rect x="0" y="0" width="591" height="50" rx="26" fill="url(#glass-sheen-dark)"/>
      <rect x="0.5" y="0.5" width="590" height="49" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>

      <rect x="15.5" y="14" width="5" height="22" rx="2.5" fill="#ffffff" fill-opacity="0.35"/>

      <g color="#ffffff9e">
        <use href="#icon-undo" x="50" y="25"/>
        <g transform="translate(90,25) scale(-1,1)"><use href="#icon-undo"/></g>
      </g>

      <line x1="114.5" y1="13" x2="114.5" y2="37" stroke="#ffffff" stroke-opacity="0.20"/>

      <g transform="translate(0,-5)">
        <rect x="119" y="5" width="40" height="40" rx="12" fill="#ff3b30" fill-opacity="0.22"/>
        <use href="#icon-pen" x="139" y="25" color="#ff3b30"/>
      </g>
      <use href="#icon-eraser" x="181" y="25" color="#ffffff9e"/>
      <use href="#icon-lasso" x="223" y="25" color="#ffffff9e"/>

      <line x1="247.5" y1="13" x2="247.5" y2="37" stroke="#ffffff" stroke-opacity="0.20"/>
      <g transform="translate(272,25)" fill="#ffffff9e"><rect x="-10" y="-8" width="20" height="1" rx="0.5"/><rect x="-10" y="-2.75" width="20" height="2.5" rx="1.25"/><rect x="-10" y="3.5" width="20" height="4.5" rx="2.25"/></g>
      <line x1="296.5" y1="13" x2="296.5" y2="37" stroke="#ffffff" stroke-opacity="0.20"/>

      <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.5">
        <circle cx="321" cy="25" r="12" fill="#ffffff"/>
        <circle cx="361" cy="25" r="12" fill="#0d0d0d"/>
        <circle cx="401" cy="25" r="12" fill="#0d73f2"/>
        <circle cx="441" cy="25" r="12" fill="#1ab340"/>
        <circle cx="481" cy="25" r="12" fill="#f2bf1a"/>
        <circle cx="521" cy="25" r="12" fill="#d92626"/>
        <circle cx="401" cy="25" r="18" fill="none"/>
      </g>
      <circle cx="401" cy="25" r="17" fill="none" stroke="#0d73f2" stroke-width="2"/>

      <g transform="translate(561,25)">
        <use href="#ink-wheel"/>
        <circle r="13" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.5"/>
      </g>
    </g>
  </g>
</svg>
